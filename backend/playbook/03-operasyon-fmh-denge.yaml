- code: SLA
  name_tr: Hizmet Seviyesi Taahhüdü (SLA)
  category: OPERASYONEL
  obligation: ZORUNLU
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 4
  detection:
    keywords_tr: ["hizmet seviyesi", "erişilebilirlik", "kullanılabilirlik", "çalışma süresi", "yanıt süresi", "sla"]
    keywords_en: ["service level", "availability", "uptime", "response time"]
  red_lines:
    - id: SLA_BEST_EFFORT
      text: "Ölçülebilir taahhüt yerine 'ticari makul çaba' ifadesi"
      severity: YUKSEK
      patterns:
        - "(?:ticari\\s+(?:olarak\\s+)?makul|makul)\\s+(?:çaba|gayret|özen)"
        - "en\\s+iyi\\s+(?:çaba|gayret)"
    - id: SLA_SOLE_REMEDY
      text: "Hizmet kredisi tek çare (sole remedy) olarak dayatılmış"
      severity: YUKSEK
      patterns:
        - "(?:tek|yegâne|yegane|münhasır)\\s+(?:çare|telafi|hak|başvuru\\s+yolu)"
        - "hizmet\\s+kredisi[^.]{0,60}(?:tek|yegâne|yegane|başkaca\\s+bir\\s+talep)"
  ideal_text_tr: >-
    Tedarikçi, hizmetin aylık erişilebilirliğinin en az %99,9 olacağını taahhüt eder. Kritik
    arızalarda yanıt süresi otuz (30) dakika, çözüm süresi dört (4) saattir. Ölçüm yöntemi ve
    aylık raporlama Ek'te düzenlenir. Hizmet kredileri Alıcının uğradığı zararı talep etme ve
    Sözleşme'yi fesih hakkını ortadan kaldırmaz.
  legal_basis: ["Bankaların Destek Hizmeti Almalarına İlişkin Yönetmelik (hizmet sürekliliği)"]
  negotiation_argument_tr: >-
    "Makul çaba" bir taahhüt değil, bir temennidir; ihlâli ispatlanamaz. Rakamsal SLA olmadan
    hizmet kalitesi hukuken denetlenemez.
  severity_if_missing: YUKSEK

- code: BUSINESS_CONTINUITY
  name_tr: İş Sürekliliği ve Felaket Kurtarma
  category: OPERASYONEL
  obligation: ZORUNLU
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 4
  detection:
    keywords_tr: ["iş sürekliliği", "felaket", "olağanüstü durum", "yedek", "kurtarma", "rto", "rpo"]
    keywords_en: ["business continuity", "disaster recovery", "backup"]
  red_lines:
    - id: BC_NO_RTO
      text: "RTO/RPO gibi ölçülebilir kurtarma hedefi yok"
      severity: YUKSEK
      absent_patterns:
        - "(?:rto|rpo|kurtarma\\s+süresi|kurtarma\\s+noktası)"
  ideal_text_tr: >-
    Tedarikçi, hizmete ilişkin iş sürekliliği ve olağanüstü durum planını Alıcı'ya sunar.
    Kurtarma Süresi Hedefi (RTO) dört (4) saat, Kurtarma Noktası Hedefi (RPO) on beş (15)
    dakikadır. Plan yılda en az bir kez test edilir ve test sonuçları Alıcı ile paylaşılır.
  legal_basis: ["Bankaların Bilgi Sistemleri Yönetmeliği (iş sürekliliği)"]
  negotiation_argument_tr: >-
    Test edilmemiş bir süreklilik planı yoktur; yalnızca bir belge vardır.
  severity_if_missing: YUKSEK

- code: EXIT_TRANSITION
  name_tr: Çıkış ve Geçiş Desteği
  category: OPERASYONEL
  obligation: ZORUNLU
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 5
  detection:
    keywords_tr: ["geçiş", "çıkış", "devir", "veri iadesi", "verilerin iadesi", "sona erme"]
    keywords_en: ["transition assistance", "exit", "data return", "termination assistance"]
  red_lines:
    - id: EXIT_DATA_DELETED
      text: "Sona ermede veriler kısa sürede siliniyor, iade formatı belirsiz"
      severity: KRITIK
      patterns:
        - "(?:sona\\s+erme|fesih)[^.]{0,80}(?:otuz|30|on\\s+beş|15|1|bir)\\s*\\(?\\s*\\d*\\s*\\)?\\s*gün[^.]{0,40}(?:sil|imha)"
  ideal_text_tr: >-
    Sözleşme'nin sona ermesi hâlinde Tedarikçi, Alıcının talebi üzerine en az altı (6) ay
    süreyle mevcut şartlarla hizmet vermeye ve geçiş desteği sağlamaya devam eder. Alıcı'ya ait
    tüm veriler, üzerinde anlaşılan makine-okunabilir standart formatta Alıcı'ya teslim edilir;
    teslimin Alıcı tarafından teyidinden sonra Tedarikçi nezdindeki kopyalar kalıcı olarak imha
    edilir ve imha tutanağı sunulur.
  legal_basis: ["Bankaların Destek Hizmeti Almalarına İlişkin Yönetmelik (çıkış stratejisi)"]
  negotiation_argument_tr: >-
    Çıkış maddesi olmayan bir sözleşme, tedarikçiye süresiz pazarlık gücü verir; yenileme
    görüşmesinde alıcı masaya elleri bağlı oturur.
  severity_if_missing: KRITIK

- code: ACCEPTANCE
  name_tr: Kabul Kriterleri ve Kabul Testi
  category: OPERASYONEL
  obligation: ZORUNLU
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 3
  detection:
    keywords_tr: ["kabul", "kabul testi", "teslim", "muayene"]
    keywords_en: ["acceptance", "acceptance test", "deemed accepted"]
  red_lines:
    - id: ACC_DEEMED
      text: "Sessiz kalma kabul sayılıyor (deemed acceptance)"
      severity: YUKSEK
      patterns:
        - "(?:itiraz\\s+edilmez(?:se)?|bildirimde\\s+bulunulmaz(?:sa)?|sessiz\\s+kal)[^.]{0,80}kabul\\s+edilmiş\\s+sayılır"
        - "kabul\\s+edilmiş\\s+sayılır"
  ideal_text_tr: >-
    Teslimatlar, Ek'te yer alan kabul test senaryolarının Alıcı tarafından başarıyla
    tamamlanması ve yazılı kabul tutanağının imzalanmasıyla kabul edilmiş sayılır. Sessiz kalma
    kabul anlamına gelmez. Uygunsuzluk tespit edilmesi hâlinde Tedarikçi on beş (15) gün içinde
    düzeltir; ikinci kez başarısız olması hâlinde Alıcı bedeli iade alarak sözleşmeyi feshedebilir.
  legal_basis: ["TBK m.474 vd. (eser sözleşmesi - ayıba karşı tekeffül)"]
  negotiation_argument_tr: >-
    "Kabul edilmiş sayılır" kaydı, alıcı ekibinin yoğunluğunu tedarikçi lehine bir hakka çevirir.
  severity_if_missing: ORTA

- code: SOURCE_CODE_ESCROW
  name_tr: Kaynak Kodu Emaneti (Escrow)
  category: FIKRI_MULKIYET
  obligation: ZORUNLU
  applies_to: [YAZILIM, SAAS, DIS_KAYNAK, CERCEVE]
  weight: 4
  detection:
    keywords_tr: ["escrow", "emanet", "kaynak kod", "kaynak kodu"]
    keywords_en: ["escrow", "source code"]
  red_lines:
    - id: ESC_NO_TRIGGER
      text: "Escrow var ama kodun açılacağı hâller (tetikleyici) tanımlanmamış"
      severity: ORTA
      absent_patterns:
        - "(?:iflas|konkordato|tasfiye|desteğ(?:i|in)\\s+(?:kes|sonlandır))"
  ideal_text_tr: >-
    Tedarikçi, yazılımın kaynak kodunu, derleme talimatlarını ve teknik dokümantasyonunu
    Alıcının onaylayacağı bağımsız bir emanet kuruluşuna tevdi eder ve her sürüm güncellemesinde
    yeniler. Tedarikçi'nin iflası, konkordatoya başvurması, tasfiyeye girmesi, bakım/destek
    hizmetini sona erdirmesi veya esaslı ihlalini otuz (30) gün içinde gidermemesi hâllerinde
    kaynak kodu Alıcı'ya teslim edilir ve Alıcı'ya kullanım hakkı doğar.
  legal_basis: ["Banka iç politika: BT-POL-007"]
  negotiation_argument_tr: >-
    Escrow tedarikçiden bir şey almaz; yalnızca tedarikçi ortadan kalktığında alıcının
    faaliyetini sürdürebilmesini sağlar. Reddedilmesi için makul bir ticari gerekçe yoktur.
  severity_if_missing: YUKSEK

- code: IP_OWNERSHIP
  name_tr: Fikri Mülkiyet ve Geliştirme Sahipliği
  category: FIKRI_MULKIYET
  obligation: ZORUNLU
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 4
  detection:
    keywords_tr: ["fikri mülkiyet", "telif", "mülkiyet", "lisans", "kullanım hakkı", "geliştirme"]
    keywords_en: ["intellectual property", "ownership", "license", "work product"]
  red_lines:
    - id: IP_ALL_TO_VENDOR
      text: "Alıcıya özel geliştirmelerin mülkiyeti de tedarikçide"
      severity: YUKSEK
      patterns:
        - "(?:tüm|her\\s+türlü|bütün)[^.]{0,60}(?:fikri\\s+mülkiyet|hak)[^.]{0,60}(?:tedarikçi|yüklenici|firma|satıcı)[^.]{0,20}(?:'?ye|ye|ya|na|ne)?\\s*aittir"
        - "{ALICI}\\s+(?:için|talebiyle)\\s+(?:yapıl(?:an|acak)|geliştiril(?:en|ecek))[^.]{0,80}(?:tedarikçi|yüklenici)"
  ideal_text_tr: >-
    Alıcının talebi üzerine ve Alıcı'ya özgü olarak geliştirilen tüm çıktıların fikri mülkiyet
    hakları Alıcı'ya aittir. Tedarikçi'nin önceden var olan (background) fikri mülkiyeti kendisinde
    kalmakla birlikte, Alıcı'ya süresiz, geri alınamaz, devredilebilir ve alt lisans verilebilir
    bir kullanım hakkı tanınır.
  legal_basis: ["5846 sayılı Fikir ve Sanat Eserleri Kanunu"]
  negotiation_argument_tr: >-
    Alıcının parasıyla, alıcının süreçleri için geliştirilen bir çıktının rakiplere satılabilir
    olması ticari olarak savunulamaz.
  severity_if_missing: YUKSEK

- code: TERMINATION
  name_tr: Fesih Hakkı
  category: SOZLESMESEL
  obligation: ZORUNLU
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 5
  detection:
    keywords_tr: ["fesih", "feshedebilir", "sona erdirme", "sözleşmenin sona ermesi"]
    keywords_en: ["termination", "terminate for convenience"]
  red_lines:
    - id: TERM_ASYMMETRIC
      text: "Tedarikçi sebepsiz feshedebiliyor; alıcı taraf için aynı hak yok"
      severity: KRITIK
      patterns:
        - "(?:tedarikçi|yüklenici|firma|satıcı)[^.]{0,80}(?:sebep\\s+göstermeksizin|herhangi\\s+bir\\s+sebep|gerekçe\\s+göstermeksizin)[^.]{0,60}feshed"
    - id: TERM_NO_REGULATORY
      text: "Regülatif zorunluluk hâlinde alıcı tarafa cezasız fesih hakkı tanınmamış"
      severity: YUKSEK
      absent_patterns:
        - "(?:mevzuat|düzenleyici|otorite|bddk)"
  ideal_text_tr: >-
    Alıcı, altmış (60) gün önceden yazılı bildirimde bulunmak kaydıyla Sözleşme'yi sebep
    göstermeksizin feshedebilir. Mevzuat değişikliği veya düzenleyici otorite talebi hâlinde
    Alıcı Sözleşme'yi derhal ve tazminatsız feshedebilir. Tedarikçi'nin sebepsiz fesih hakkı
    bulunmamakla birlikte, esaslı ihlalin otuz (30) gün içinde giderilmemesi hâlinde her iki
    Taraf da haklı nedenle feshedebilir.
  legal_basis: ["Bankaların Destek Hizmeti Almalarına İlişkin Yönetmelik"]
  negotiation_argument_tr: >-
    Alıcının regülatif zorunlulukla feshetmesi bir tercih değil, yükümlülüktür; bu hakkın
    tazminata bağlanması alıcıyı mevzuata uymakla ceza ödemek arasında bırakır.
  severity_if_missing: KRITIK

- code: AUTO_RENEWAL
  name_tr: Otomatik Yenileme
  category: SOZLESMESEL
  obligation: ONERILEN
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 3
  detection:
    keywords_tr: ["yenilen", "uzar", "otomatik olarak", "süre uzatımı"]
    keywords_en: ["auto-renew", "automatically renewed", "evergreen"]
  red_lines:
    - id: RENEW_LONG_NOTICE
      text: "Otomatik yenilemede iptal ihbar süresi uzun (60 gün ve üzeri)"
      severity: ORTA
      patterns:
        - "(?:altmış|60|doksan|90|yüz\\s+seksen|180)\\s*\\(?\\s*\\d*\\s*\\)?\\s*gün[^.]{0,80}(?:yenilen|uzar)"
    - id: RENEW_AUTOMATIC
      text: "Sözleşme kendiliğinden uzuyor; yenileme kararı alıcı tarafın iradesine bağlı değil"
      severity: ORTA
      patterns:
        - "(?:kendiliğinden|otomatik\\s+olarak)[^.]{0,60}(?:yenilen[a-zçğıöşü]*|uzar|uzatıl[a-zçğıöşü]*)"
        - "ihbarda\\s+bulunulmadığı|ihbarda\\s+bulunmadıkları"
  ideal_text_tr: >-
    Sözleşme süresi sonunda kendiliğinden uzamaz. Tarafların yazılı mutabakatı hâlinde yenilenir.
    Otomatik yenileme öngörülmesi hâlinde Alıcının iptal bildirim süresi otuz (30) günü aşamaz
    ve yenileme fiyat artışına bağlanamaz.
  legal_basis: ["Banka iç politika: SAT-POL-021"]
  negotiation_argument_tr: >-
    Uzun ihbar süreli otomatik yenileme, alıcıyı ihtiyacı kalmayan bir hizmete bir yıl daha
    bağlar. İdari bir gecikmenin bedeli bir yıllık lisans olmamalıdır.
  severity_if_missing: DUSUK

- code: ASSIGNMENT_CHANGE_OF_CONTROL
  name_tr: Devir, Temlik ve Kontrol Değişikliği
  category: SOZLESMESEL
  obligation: ONERILEN
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 3
  detection:
    keywords_tr: ["devir", "devredebilir", "temlik", "hisse", "kontrol değişikliği", "birleşme"]
    keywords_en: ["assignment", "change of control", "merger"]
  red_lines:
    - id: ASSIGN_FREE
      text: "Tedarikçi sözleşmeyi/alacağını serbestçe devredebiliyor"
      severity: ORTA
      patterns:
        - "(?:tedarikçi|yüklenici|firma)[^.]{0,80}(?:onay\\s+(?:almaksızın|olmaksızın)|serbestçe)[^.]{0,40}(?:devred|temlik)"
    - id: ASSIGN_NO_COC
      text: "Kontrol değişikliği hâlinde alıcı tarafa fesih hakkı tanınmamış"
      severity: ORTA
      absent_patterns:
        - "(?:kontrol\\s+değişikliği|hisse(?:leri)?nin\\s+devri|pay\\s+devri|birleşme)"
  ideal_text_tr: >-
    Taraflar, diğer Tarafın önceden yazılı onayı olmaksızın Sözleşme'yi veya ondan doğan hak ve
    alacaklarını devredemez. Tedarikçi'nin doğrudan veya dolaylı kontrolünün değişmesi hâlinde
    Alıcı, Sözleşme'yi tazminatsız feshetme hakkına sahiptir.
  legal_basis: ["TBK m.183 vd."]
  negotiation_argument_tr: >-
    Alıcının kiminle çalışacağını seçme hakkı, tedarikçinin el değiştirmesiyle ortadan kalkmamalıdır.
  severity_if_missing: ORTA

- code: GOVERNING_LAW
  name_tr: Uygulanacak Hukuk ve Yetkili Merci
  category: SOZLESMESEL
  obligation: ZORUNLU
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 4
  detection:
    keywords_tr: ["uygulanacak hukuk", "yetkili mahkeme", "tahkim", "uyuşmazlık", "icra daireleri"]
    keywords_en: ["governing law", "jurisdiction", "arbitration"]
  red_lines:
    - id: LAW_FOREIGN
      text: "Yabancı hukuk ve/veya yabancı tahkim yetkisi öngörülmüş"
      severity: YUKSEK
      patterns:
        - "(?:ingiltere|birleşik\\s+krallık|new\\s+york|delaware|isviçre|hollanda|singapur|irlanda)\\s+(?:hukuku|kanunları|yasaları)"
        - "(?:londra|paris|cenevre|zürih|singapur|stockholm)\\s+(?:tahkim|uluslararası)"
        - "(?:icc|lcia|siac|uncitral)\\s+tahkim"
  ideal_text_tr: >-
    İşbu Sözleşme Türk hukukuna tabidir. Uyuşmazlıkların çözümünde İstanbul (Çağlayan)
    Mahkemeleri ve İcra Daireleri yetkilidir. Sözleşme'nin Türkçe ve İngilizce metinleri
    arasında çelişki bulunması hâlinde Türkçe metin esas alınır.
  legal_basis: ["5718 sayılı MÖHUK", "HMK m.17"]
  negotiation_argument_tr: >-
    Yabancı hukuk ve tahkim, alıcının hak arama maliyetini fiilen caydırıcı seviyeye çıkarır ve
    Türk bankacılık mevzuatının uygulanmasını belirsizleştirir.
  severity_if_missing: YUKSEK

- code: FORCE_MAJEURE
  name_tr: Mücbir Sebep
  category: SOZLESMESEL
  obligation: ONERILEN
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 3
  detection:
    keywords_tr: ["mücbir sebep", "beklenmeyen hal", "force majeure"]
    keywords_en: ["force majeure"]
  red_lines:
    - id: FM_TOO_BROAD
      text: "Mücbir sebep tanımı tedarikçinin kendi alanındaki riskleri de kapsıyor"
      severity: YUKSEK
      patterns:
        # Yakınlık penceresi ([^.]{0,N}) kullanılmıyor: Türkçe hukuk metninde
        # "vb.", "m.", "A.Ş." gibi kısaltmalardaki nokta pencereyi kesiyor ve
        # eşleşme sessizce kaçıyordu. Desen zaten YALNIZCA mücbir sebep maddesi
        # olarak sınıflandırılmış maddede çalıştığı için yakınlık şartı gereksiz.
        - "(?:siber\\s+saldırı|alt\\s+yüklenici|tedarik\\s+zinciri|personel\\s+yetersizliği|grev|lokavt)"
  ideal_text_tr: >-
    Mücbir sebep; Tarafların kontrolü dışında gelişen, öngörülemeyen ve kaçınılamayan olayları
    ifade eder. Tedarikçi'nin kendi sistemlerine yönelik siber saldırılar, alt yüklenici
    kaynaklı aksaklıklar, personel yetersizliği ve tedarik zinciri sorunları mücbir sebep
    sayılmaz. Mücbir sebep hâli otuz (30) günü aşarsa Alıcı Sözleşme'yi tazminatsız feshedebilir.
  legal_basis: ["TBK m.136"]
  negotiation_argument_tr: >-
    Siber güvenlik tedarikçinin asli edim yükümlülüğüdür; onu mücbir sebep saymak, taahhüdün
    kendisini ortadan kaldırır.
  severity_if_missing: ORTA

- code: REFERENCE_USE
  name_tr: Referans ve Marka Kullanımı
  category: ETIK_ITIBAR
  obligation: ONERILEN
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 2
  detection:
    keywords_tr: ["referans", "logo", "unvan", "marka", "tanıtım", "basın"]
    keywords_en: ["reference", "logo", "publicity", "press release"]
  red_lines:
    - id: REF_FREE_USE
      text: "Tedarikçi alıcı tarafı izinsiz referans gösterebiliyor"
      severity: ORTA
      patterns:
        - "(?:referans|logo|unvan|marka)[^.]{0,80}(?:kullanabilir|gösterebilir|yer\\s+verebilir)"
  ideal_text_tr: >-
    Tedarikçi, Alıcının önceden ve her kullanım için ayrı ayrı verilmiş yazılı onayı olmaksızın
    Alıcının unvanını, markasını veya logosunu referans, tanıtım veya basın materyallerinde
    kullanamaz.
  legal_basis: ["Banka iç politika: KUR-POL-002"]
  negotiation_argument_tr: >-
    Alıcının hangi tedarikçiyle çalıştığı bilgisi, alıcının iletişim stratejisinin parçasıdır.
  severity_if_missing: DUSUK

- code: SANCTIONS_ABC
  name_tr: Yaptırımlar ve Rüşvetle Mücadele
  category: ETIK_ITIBAR
  obligation: ZORUNLU
  applies_to: [SAAS, YAZILIM, HIZMET, DONANIM, DIS_KAYNAK, CERCEVE]
  weight: 3
  detection:
    keywords_tr: ["yaptırım", "ambargo", "rüşvet", "yolsuzluk", "ofac", "kara para"]
    keywords_en: ["sanctions", "embargo", "anti-bribery", "corruption", "ofac"]
  red_lines: []
  ideal_text_tr: >-
    Tedarikçi, kendisinin, ortaklarının ve alt yüklenicilerinin ulusal veya uluslararası
    yaptırım listelerinde yer almadığını beyan ve taahhüt eder. Tedarikçi, rüşvet ve
    yolsuzlukla mücadeleye ilişkin mevzuata uyar. Bu taahhütlerin ihlali hâlinde Alıcı
    Sözleşme'yi derhal ve tazminatsız feshedebilir.
  legal_basis: ["5549 sayılı Kanun (MASAK)", "Banka iç politika: UYU-POL-003"]
