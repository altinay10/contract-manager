services:
  feneri:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sozlesme-feneri:0.1
    container_name: sozlesme-feneri
    restart: unless-stopped
    ports:
      # Yalniz localhost: uygulamaya ters vekil (nginx) uzerinden erisilir.
      - "127.0.0.1:${HOST_PORT:-8099}:8000"
    # Not: docker compose, proje dizinindeki .env dosyasını aşağıdaki ${...}
    # ifadeleri için otomatik okur; ayrıca env_file tanımlamaya gerek yoktur.
    environment:
      # --- model (anahtar verilmezse sistem kural tabanlı modda çalışır) ---
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      MODEL_OPENAI: "${MODEL_OPENAI:-gpt-4.1}"
      CUSTOM_BASE_URL: "${CUSTOM_BASE_URL:-}"
      MODEL_CUSTOM: "${MODEL_CUSTOM:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-auto}"   # auto|anthropic|openai|gemini|custom|heuristic
      MODEL_MAIN: "claude-opus-5"
      MODEL_GEMINI: "gemini-flash-latest"
      MODEL_GEMINI_CHEAP: "gemini-flash-lite-latest"

      # --- token/maliyet tavanları: aşılınca model kapanır, analiz kural katmanıyla sürer ---
      MAX_LLM_CALLS: "${MAX_LLM_CALLS:-80}"
      MAX_COST_USD: "${MAX_COST_USD:-1.00}"
      MAX_TOTAL_TOKENS: "${MAX_TOTAL_TOKENS:-400000}"
      LLM_DEADLINE_SECONDS: "${LLM_DEADLINE_SECONDS:-900}"
      LLM_TIMEOUT_SECONDS: "90"
      MAX_CONSECUTIVE_FAILURES: "3"
      MAX_LLM_CLAUSES: "${MAX_LLM_CLAUSES:-40}"
      ENABLE_LENSES: "${ENABLE_LENSES:-1}"
      ENABLE_REBUTTAL: "${ENABLE_REBUTTAL:-1}"

      # --- kimlik doğrulama ---
      AUTH_ENABLED: "${AUTH_ENABLED:-1}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_HOURS: "${SESSION_HOURS:-12}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"

      # --- OCR (taranmış belgeler) ---
      OCR_ENABLED: "${OCR_ENABLED:-1}"
      OCR_LANG: "${OCR_LANG:-tur+eng}"
      OCR_DPI: "${OCR_DPI:-300}"
      OCR_MAX_PAGES: "${OCR_MAX_PAGES:-60}"
      SWEEPER_ENABLED: "${SWEEPER_ENABLED:-1}"

      # --- dayanıklılık ---
      STAGE_MAX_ATTEMPTS: "3"
      ITEM_MAX_ATTEMPTS: "2"
      ORPHAN_AFTER_SECONDS: "90"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-40}"
    # Küçük donanımda (Raspberry Pi) konteynerin belleği tüketmesini engeller.
    mem_limit: ${MEM_LIMIT:-1500m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Analiz durumu ve raporlar konteyner dışında yaşar.
      - feneri-data:/data
      # Playbook'u yeniden derlemeden güncelleyebilmek için bağlı:
      - ./backend/playbook:/srv/playbook:ro

volumes:
  feneri-data:
